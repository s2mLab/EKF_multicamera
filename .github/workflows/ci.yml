name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python and conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: ekf-ci

      - name: Install biorbd
        run: conda install -y biorbd=1.11.2

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Install biobuddy
        # Pinned to the commit used by environment.vitpose-ekf.yml. biorbd comes
        # from conda, so biobuddy is installed without its own dependencies; plotly
        # (needed at import time) is installed with its dependencies.
        run: |
          pip install plotly
          pip install --no-deps "git+https://github.com/pyomeca/biobuddy.git@85ec552f4c73152590336ca571c1a32ed911c75a"

      - name: Run isort --check-only
        id: isort
        continue-on-error: true
        run: isort . --check-only --profile black

      - name: Run black --check
        id: black
        continue-on-error: true
        run: black . --check --verbose

      - name: Run flake8
        id: flake8
        continue-on-error: true
        run: flake8 .

      - name: Run test suite
        id: pytest
        continue-on-error: true
        run: pytest -q

      - name: Summarize check outcomes
        if: always()
        run: |
          echo "isort:  ${{ steps.isort.outcome }}"
          echo "black:  ${{ steps.black.outcome }}"
          echo "flake8: ${{ steps.flake8.outcome }}"
          echo "pytest: ${{ steps.pytest.outcome }}"
          {
            echo "## CI check outcomes"
            echo ""
            echo "- isort: \`${{ steps.isort.outcome }}\`"
            echo "- black: \`${{ steps.black.outcome }}\`"
            echo "- flake8: \`${{ steps.flake8.outcome }}\`"
            echo "- pytest: \`${{ steps.pytest.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          failed_checks=()
          [ "${{ steps.isort.outcome }}" = "success" ] || failed_checks+=("isort")
          [ "${{ steps.black.outcome }}" = "success" ] || failed_checks+=("black")
          [ "${{ steps.flake8.outcome }}" = "success" ] || failed_checks+=("flake8")
          [ "${{ steps.pytest.outcome }}" = "success" ] || failed_checks+=("pytest")
          if [ ${#failed_checks[@]} -gt 0 ]; then
            echo "Failed checks: ${failed_checks[*]}"
            exit 1
          fi
